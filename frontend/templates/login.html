{% extends "base.html" %}

{% block title %}
Login | InventoryPro
{% endblock %}

{% block header %}
Login
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <div class="login-icon">
            📦
        </div>

        <h1>
            InventoryPro
        </h1>

        <p class="login-subtitle">
            Sign in to your inventory dashboard
        </p>


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="button"
            id="login-button"
            onclick="loginUser()"
        >
            Login
        </button>


        <!-- ERROR -->

        <div
            id="login-error"
            class="login-error"
        ></div>


        <!-- SUCCESS -->

        <div
            id="login-success"
            class="login-success"
        ></div>

    </div>

</div>


<style>

/* ==========================================
   LOGIN CONTAINER
========================================== */

.login-container {

    min-height: 70vh;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* ==========================================
   LOGIN CARD
========================================== */

.login-card {

    width: 100%;

    max-width: 420px;

    background: white;

    padding: 35px;

    border-radius: 16px;

    box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);

}


/* ==========================================
   ICON
========================================== */

.login-icon {

    width: 65px;

    height: 65px;

    margin: 0 auto 15px;

    border-radius: 16px;

    background: #f3f4f6;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 32px;

}


/* ==========================================
   TITLE
========================================== */

.login-card h1 {

    text-align: center;

    margin: 0;

    color: #111827;

}


.login-subtitle {

    text-align: center;

    color: #6b7280;

    margin:
        8px 0 28px;

}


/* ==========================================
   FORM
========================================== */

.form-group {

    margin-bottom: 18px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    font-weight: 600;

    color: #374151;

}


.form-group input {

    width: 100%;

    box-sizing: border-box;

    padding: 12px 14px;

    border:
        1px solid #d1d5db;

    border-radius: 8px;

    font-size: 15px;

    outline: none;

}


.form-group input:focus {

    border-color: #2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.1);

}


/* ==========================================
   LOGIN BUTTON
========================================== */

#login-button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

}


#login-button:hover {

    background: #1d4ed8;

}


#login-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


/* ==========================================
   MESSAGES
========================================== */

.login-error {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 8px;

    background: #fee2e2;

    color: #991b1b;

    font-size: 14px;

}


.login-success {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 8px;

    background: #dcfce7;

    color: #166534;

    font-size: 14px;

}

</style>

{% endblock %}


{% block extra_js %}

<script>

async function loginUser() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    const errorBox =
        document.getElementById(
            "login-error"
        );

    const successBox =
        document.getElementById(
            "login-success"
        );

    const button =
        document.getElementById(
            "login-button"
        );


    /*
     * Clear old messages
     */

    errorBox.style.display = "none";

    successBox.style.display = "none";


    /*
     * Validation
     */

    if (!username || !password) {

        errorBox.textContent =
            "Please enter username and password.";

        errorBox.style.display = "block";

        return;
    }


    /*
     * Disable button
     */

    button.disabled = true;

    button.textContent = "Logging in...";


    try {

        /*
         * Request JWT token
         */

        const response =
            await fetch(
                "/api/auth/token/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


        const data =
            await response.json();


        /*
         * Login failed
         */

        if (!response.ok) {

            errorBox.textContent =
                data.detail ||
                "Invalid username or password.";

            errorBox.style.display =
                "block";

            button.disabled = false;

            button.textContent = "Login";

            return;
        }


        /*
         * Save ACCESS token
         */

        localStorage.setItem(
            "access_token",
            data.access
        );


        /*
         * Save REFRESH token
         */

        if (data.refresh) {

            localStorage.setItem(
                "refresh_token",
                data.refresh
            );

        }


        /*
         * Success message
         */

        successBox.textContent =
            "Login successful. Redirecting...";

        successBox.style.display =
            "block";


        /*
         * Open dashboard
         */

        setTimeout(
            function() {

                window.location.href =
                    "/dashboard/";

            },
            500
        );

    }

    catch (error) {

        errorBox.textContent =
            "Unable to connect to server.";

        errorBox.style.display =
            "block";

        button.disabled = false;

        button.textContent = "Login";

    }

}

</script>

{% endblock %}
